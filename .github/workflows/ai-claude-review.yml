# Independent AI review: Claude reviews PRs written by Factory Droid (label ai:factory).
#  - Issues found  -> posts "[AI-REVIEW] CHANGES_REQUESTED" review -> ai-review-fix.yml makes
#                     the AI fix them on the same branch -> the push triggers a new review.
#  - Clean         -> posts "[AI-REVIEW] APPROVED" -> ready for human merge.
# Max 3 review rounds per PR, then it hands over to a human.
name: AI Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'labeled' || github.event.label.name == 'ai:factory'))
    concurrency:
      group: ai-claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      MAX_ROUNDS: ${{ vars.AI_REVIEW_MAX_ROUNDS || '3' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # PRs into this branch are merged automatically once Claude approves and CI is green.
      AUTO_MERGE_BASE: ${{ vars.AI_AUTO_MERGE_BASE || 'develop' }}
    steps:
      - name: Decide whether to review
        id: gate
        run: |
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          labels="$(jq -r '[.labels[].name] | join(",")' <<<"$pr")"
          state="$(jq -r .state <<<"$pr")"; draft="$(jq -r .draft <<<"$pr")"
          echo "::notice title=PR::#$PR_NUMBER labels=[$labels] state=$state draft=$draft"
          go=true
          [[ "$state" == "open" && "$draft" == "false" ]] || go=false
          [[ ",$labels," == *",ai:factory,"* ]] || { echo "::notice::Not an ai:factory PR — skipping Claude review."; go=false; }
          rounds="$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --jq '[.[] | select(.body | startswith("[AI-REVIEW]"))] | length' | awk '{s+=$1} END {print s+0}')"
          echo "rounds=$rounds" >> "$GITHUB_OUTPUT"
          if [[ "$go" == "true" && "$rounds" -ge "$MAX_ROUNDS" ]]; then
            last="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '[.[] | select(.body | startswith("[AI-REVIEW] Max rounds"))] | length' | awk '{s+=$1} END {print s+0}')"
            if [[ "$last" -eq 0 ]]; then
              gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="[AI-REVIEW] Max rounds ($MAX_ROUNDS) reached — a human reviewer needs to take over this PR." >/dev/null
            fi
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.ref <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "BASE_REF=$(jq -r .base.ref <<<"$pr")" >> "$GITHUB_ENV"
          echo "ISSUE_KEY=$(grep -oE '[A-Z][A-Z0-9]+-[0-9]+' <<<"$(jq -r .head.ref <<<"$pr")" | head -n1 || true)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ steps.gate.outputs.head }}
          fetch-depth: 0

      - name: Collect review context
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir -p .ai
          git fetch -q origin "$DEFAULT_BRANCH" "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > .ai/diff.patch
          # Always use the current instructions from the default branch, not the (possibly older) PR branch.
          git show "origin/$DEFAULT_BRANCH:.github/ai-prompts/review.md" > .ai/instructions.md
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '"# \(.title)\n\n\(.body // "")"' > .ai/pr.md
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '.[] | select(.body | startswith("[AI-REVIEW]")) | "## Review \(.submitted_at)\n\(.body)\n"' > .ai/previous_reviews.md || true
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("[AI-FIX] Done")) | "## Fix \(.created_at)\n\(.body)\n"' >> .ai/previous_reviews.md || true
          if [[ -n "$ISSUE_KEY" ]]; then
            chmod +x scripts/jira.sh
            scripts/jira.sh fetch "$ISSUE_KEY" > .ai/ticket.md 2>/dev/null || true
            bash <(git show "origin/$DEFAULT_BRANCH:scripts/jira.sh") attachments "$ISSUE_KEY" .ai/design || true
            if [[ -s .ai/design/index.md ]]; then
              { echo; echo "## Design screenshots (attached to the Jira ticket)"; echo "Open each image and match the UI to it:"; cat .ai/design/index.md; } >> .ai/ticket.md
            fi
            scripts/jira.sh latest-plan "$ISSUE_KEY" > .ai/plan.md 2>/dev/null || true
          fi
          echo "::notice title=Diff::$(wc -l < .ai/diff.patch) lines, round $(( ${{ steps.gate.outputs.rounds }} + 1 ))"

      - name: Claude reviews the PR
        id: claude
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*)"
          prompt: |
            Read the file .ai/instructions.md and follow its instructions exactly.

      - name: Post the review
        if: steps.gate.outputs.go == 'true'
        run: |
          f=.ai/review.json
          exe="${{ steps.claude.outputs.execution_file }}"
          # Fallbacks: JSON wrapped in a code fence, or only in Claude's final message.
          if [[ -f "$f" ]] && ! jq -e '.verdict' "$f" >/dev/null 2>&1; then
            sed -n '/^[[:space:]]*{/,/^[[:space:]]*}[[:space:]]*$/p' "$f" > .ai/review.clean.json && mv .ai/review.clean.json "$f"
          fi
          if ! jq -e '.verdict' "$f" >/dev/null 2>&1 && [[ -f "$exe" ]]; then
            jq -r '[.[] | select(.type=="result")] | last | .result // ""' "$exe" \
              | sed -n '/^[[:space:]]*{/,/^[[:space:]]*}[[:space:]]*$/p' > "$f" || true
          fi
          if ! jq -e '.verdict' "$f" >/dev/null 2>&1; then
            echo "::error title=Review file::$( (ls -la .ai; head -c 400 "$f" 2>/dev/null) | tr '\n' ' ' | head -c 900)"
            [[ -f "$exe" ]] && echo "::error title=Claude result::$(jq -r '[.[] | select(.type=="result")] | last | ((.subtype // "") + ": " + ((.result // "") | tostring))' "$exe" | tr '\n' ' ' | head -c 900)"
            echo "::error title=Review::Claude did not produce a valid .ai/review.json"; exit 1
          fi
          verdict="$(jq -r .verdict "$f")"
          round=$(( ${{ steps.gate.outputs.rounds }} + 1 ))
          if [[ "$verdict" == "changes" ]]; then tag="[AI-REVIEW] CHANGES_REQUESTED"; else tag="[AI-REVIEW] APPROVED"; fi
          {
            echo "$tag — round $round of $MAX_ROUNDS (reviewer: Claude)"
            echo
            jq -r .summary "$f"
            echo
            if [[ "$(jq '.issues | length' "$f")" -gt 0 ]]; then
              echo "### Issues"
              jq -r '.issues[] | "- **[\(.severity)]** `\(.path)\(if .line then ":\(.line)" else "" end)` — **\(.title)**: \(.detail)"' "$f"
              echo
            fi
            if [[ "$verdict" == "changes" ]]; then
              echo "_The AI will now fix the blocker/major issues on this branch and push. A new review runs after the push._"
            elif [[ "$BASE_REF" == "$AUTO_MERGE_BASE" ]]; then
              echo "_No blocking issues. It will be merged into \`$BASE_REF\` automatically once CI is green, and QA starts._"
            else
              echo "_No blocking issues. Ready for human review and merge._"
            fi
          } > .ai/review_body.md
          # The PR author is the bot account, so GitHub only allows a COMMENT-type review here.
          jq -n --rawfile body .ai/review_body.md --arg sha "${{ steps.gate.outputs.sha }}" \
            '{event:"COMMENT", body:$body, commit_id:$sha}' \
            | gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --input - > /dev/null
          echo "::notice title=Review posted::$tag (round $round)"
          echo "VERDICT=$verdict" >> "$GITHUB_ENV"
          if [[ -n "$ISSUE_KEY" ]]; then
            printf '%s on PR #%s (round %s)\n%s\n' "$tag" "$PR_NUMBER" "$round" "${{ github.server_url }}/$REPO/pull/$PR_NUMBER" > .ai/jira-review.md
            scripts/jira.sh comment "$ISSUE_KEY" .ai/jira-review.md || true
          fi

      - name: Auto-merge into develop (Claude approved + CI green)
        if: steps.gate.outputs.go == 'true' && env.VERDICT == 'approve' && env.BASE_REF == env.AUTO_MERGE_BASE
        env:
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          # Wait for the CI "check" job on this exact commit (max ~25 min).
          ci=""
          for i in $(seq 1 75); do
            ci="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=check" --jq '[.check_runs[] | select(.app.slug=="github-actions")] | sort_by(.started_at) | last | "\(.status) \(.conclusion // "")"' 2>/dev/null || true)"
            [[ "$ci" == completed* ]] && break
            sleep 20
          done
          echo "::notice title=CI::$ci"
          if [[ "$ci" != "completed success" ]]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="[AI-MERGE] Not merged automatically: CI is \`${ci:-not found}\` on $SHA. Fix CI (or comment \`@droid\`), then the next approval will merge it." > /dev/null
            exit 0
          fi
          # "sha" makes the merge fail if someone pushed after the review.
          if out="$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=merge -f sha="$SHA" 2>&1)"; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="[AI-MERGE] Merged into \`$BASE_REF\` (Claude approved, CI green). QA starts automatically." > /dev/null
            echo "::notice title=Merged::PR #$PR_NUMBER into $BASE_REF"
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="[AI-MERGE] Could not merge automatically: $(head -c 300 <<<"$out"). Please merge manually." > /dev/null
          fi

      - name: Report failure on the PR
        if: failure() && steps.gate.outputs.go == 'true'
        run: |
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="[AI-REVIEW] Failed — the Claude review run did not complete. Logs: $RUN_URL" > /dev/null || true
