# Factory's official automatic PR review (human and Claude-written PRs). Feeds the Factory dashboard VALIDATE stage.
# Needs: Factory Droid GitHub App installed on this repo + FACTORY_API_KEY secret.
name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  # Factory must not review PRs that Factory itself wrote (label ai:factory) — Claude reviews those.
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10  # let labels added at PR creation land
          labels="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '[.[].name] | join(",")')"
          if [[ ",$labels," == *",ai:factory,"* ]]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "::notice::ai:factory PR — skipped (Claude reviews it)"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  review:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
