# Phase 1 — Jira ticket -> Claude writes a plan -> plan posted back to Jira for approval.
# Triggered by Jira Automation (repository_dispatch "jira-plan") or manually.
name: AI Plan (Jira)

on:
  repository_dispatch:
    types: [jira-plan]
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Jira issue key (e.g. FIT-123)"
        required: true

concurrency:
  group: ai-${{ github.event.client_payload.issue_key || inputs.issue_key }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Validate issue key
        run: |
          [[ "$ISSUE_KEY" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]] || { echo "Bad issue key: $ISSUE_KEY"; exit 1; }

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Fetch Jira ticket
        run: |
          chmod +x scripts/jira.sh
          mkdir -p .ai
          scripts/jira.sh fetch "$ISSUE_KEY" > .ai/ticket.md
          cat .ai/ticket.md

      - name: Claude writes the plan
        uses: anthropics/claude-code-action@v1
        with:
          # Use ONE of these two:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(flutter analyze:*),Bash(ls:*)"
          # Safe by design: this job has read-only repo permissions and never pushes,
          # so even a stray edit is thrown away when the runner ends.
          prompt: |
            You are the planning agent for this Flutter project. Follow CLAUDE.md.

            Read the Jira ticket in .ai/ticket.md (it includes all comments — if the
            reviewer left feedback on an earlier [AI-PLAN], address it in this new plan).
            Explore the codebase to understand the current architecture.

            DO NOT modify any project code. Your only output is the file .ai/plan.md.

            Write .ai/plan.md in this exact structure (Jira wiki markup is fine, plain markdown is fine too):

            [AI-PLAN] <ISSUE KEY> — <short title>
            h3. Understanding
            What the ticket asks for, in 2–4 sentences. List any assumptions.
            h3. Open questions
            Anything ambiguous. If something blocks implementation, say so clearly.
            h3. Approach
            Architecture decisions (state management, layers, packages to add and why).
            h3. Files
            Every file to create / modify / delete, with a one-line purpose each.
            h3. Steps
            Numbered, small, ordered steps. Each step = one commit, with its planned
            Conventional Commit message, e.g. "feat(auth): add login bloc".
            h3. Testing
            Unit / bloc / widget tests to add and how to verify manually.
            h3. Risks
            Breaking changes, migrations, performance, anything the reviewer should know.

            ----
            ✅ To approve: drag this ticket to *In development*.
            ✏️ To request changes: add a comment with feedback, move the ticket back to *Open*, then to *Ready to work* again.

      - name: Post plan to Jira
        run: |
          test -s .ai/plan.md || { echo "Claude did not produce .ai/plan.md"; exit 1; }
          scripts/jira.sh comment "$ISSUE_KEY" .ai/plan.md

      - name: Report failure to Jira
        if: failure()
        run: |
          echo "AI planning failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > .ai/fail.md
          scripts/jira.sh comment "$ISSUE_KEY" .ai/fail.md || true
