name: CI
on:
  push:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Format diff
        run: |
          dart format .
          git diff > format.patch || true
          echo "=====PATCH-START====="
          cat format.patch
          echo "=====PATCH-END====="
      - name: Analyze
        if: always()
        run: flutter analyze
      - name: Test
        if: always()
        run: flutter test
