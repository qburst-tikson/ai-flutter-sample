name: CI
on:
  push:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and commit back
        run: |
          dart format lib test
          git config user.name ci-format
          git config user.email ci@format
          git add lib test
          git commit -m "formatted" || echo nothing
          git push
